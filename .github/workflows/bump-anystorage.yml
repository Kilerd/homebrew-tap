name: Bump anystorage cask

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [anystorage-release]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/Kilerd/anystorage-release/releases/latest --jq .tag_name)
          version="${tag#v}"
          current=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/anystorage.rb)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$version current=$current"

      - name: Update cask
        if: steps.latest.outputs.version != steps.latest.outputs.current
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/Kilerd/anystorage-release/releases/download/v${VERSION}"
          curl -fsSL -o arm.dmg   "${base}/AnyStorage_${VERSION}_aarch64.dmg"
          curl -fsSL -o intel.dmg "${base}/AnyStorage_${VERSION}_x64.dmg"
          arm=$(sha256sum arm.dmg | cut -d' ' -f1)
          intel=$(sha256sum intel.dmg | cut -d' ' -f1)
          python3 - "$VERSION" "$arm" "$intel" <<'PY'
          import pathlib, re, sys
          version, arm, intel = sys.argv[1:]
          p = pathlib.Path("Casks/anystorage.rb"); s = p.read_text()
          s, n1 = re.subn(r'^  version ".*"$', f'  version "{version}"', s, flags=re.M)
          s, n2 = re.subn(r'(sha256 arm:\s+")[0-9a-f]{64}(")', rf'\g<1>{arm}\g<2>', s)
          s, n3 = re.subn(r'(intel: ")[0-9a-f]{64}(")', rf'\g<1>{intel}\g<2>', s)
          assert (n1, n2, n3) == (1, 1, 1), (n1, n2, n3)
          p.write_text(s)
          PY
          rm -f arm.dmg intel.dmg
          git diff --stat

      - name: Commit and push
        if: steps.latest.outputs.version != steps.latest.outputs.current
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/anystorage.rb
          git commit -m "chore(anystorage): bump cask to ${VERSION}"
          git push
